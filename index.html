<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hanzi-practice-buddy</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#000000" />

<script src="https://unpkg.com/hanzi-writer@2.3.0/dist/hanzi-writer.min.js"></script>
<script src="https://unpkg.com/pinyin-pro/dist/index.js"></script>
<script src="https://unpkg.com/opencc-js@1.0.5/dist/umd/full.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial, sans-serif; padding: 10px; text-align: center; background:#fff; color:#000; }
body.dark { background:#000; color:#fff; }
textarea { width:100%; height:100px; margin-bottom:5px; }
#writer { width:300px; height:300px; margin:15px auto; border:1px solid #ccc; }
#char { font-size:56px; margin-top:10px; }
#pinyin { font-size:18px; margin-bottom:5px; }
#vocabInfo { font-size:14px; margin:8px auto; max-width: 400px; line-height: 1.4; color: #555; }
body.dark #vocabInfo { color: #aaa; }
#stats { font-size:14px; margin-top:5px; font-style:italic; white-space: pre-line; }
button { margin:5px; padding:8px 12px; font-size:15px; cursor:pointer; }
#streak { font-size:20px; margin:6px; }
#feedback {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.5);
  font-size: 120px; pointer-events: none;
  opacity: 0; transition: opacity 0.2s, transform 0.2s;
  z-index: 1000;
}
#feedback.show {
  opacity: 1; transform: translate(-50%, -50%) scale(1);
}
#completionMessage {
  position: fixed; top: 40%; left: 50%;
  transform: translate(-50%, -50%);
  max-width: calc(100vw - 48px);
  box-sizing: border-box;
  font-size: 24px; color: green;
  background: rgba(255,255,255,0.96);
  padding: 20px; border: 2px solid green; border-radius: 10px;
  z-index: 1001; text-align: center;
}
#completionMessage[hidden] { display: none; }
.controls-group { margin: 10px 0; }
#currentListName { font-size: 13px; margin-top: 4px; color: #555; }
body.dark #currentListName { color: #aaa; }
#syncPanel { max-width: 520px; margin: 12px auto; padding: 8px; border: 1px solid #ccc; border-radius: 8px; }
#syncStatus { font-size: 13px; margin: 6px; }
#syncPanel input { max-width: 210px; margin: 4px; padding: 7px; }
</style>
</head>
<body>

<h2>hanzi-practice-buddy</h2>
<div id="streak">🔥 0</div>
<button id="darkToggle">🌙 / ☀️</button>

<div id="syncPanel" class="controls-group" aria-label="Cloud sync">
  <strong>Cloud vocabulary sync</strong>
  <div id="syncStatus" role="status" aria-live="polite">Local-only mode; custom lists remain on this device.</div>
  <input id="syncEmail" type="email" autocomplete="email" placeholder="Email for sync account" aria-label="Email for sync account">
  <input id="syncPassword" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password for sync account">
  <button id="syncSignInBtn" type="button">Sign in</button>
  <button id="syncSignUpBtn" type="button">Create account</button>
  <button id="syncGoogleLinkBtn" type="button" hidden>Link Google account</button>
  <button id="syncSignOutBtn" type="button" hidden>Sign out</button>
</div>

<div id="courseVocabularyPanel" class="controls-group" aria-label="Course-app vocabulary source">
  <label for="courseApiBaseUrl"><b>Course-app API URL:</b></label><br>
  <input id="courseApiBaseUrl" type="url" inputmode="url" placeholder="https://your-course-app.example" aria-label="Course-app API base URL" style="width:min(90%,420px);padding:7px;">
  <button id="saveCourseApiUrlBtn" type="button">Save API URL</button>
  <div id="courseApiStatus" role="status" aria-live="polite">Configure the course-app URL to load shared vocabulary from Neon.</div>
</div>

<div class="controls-group">
  <label for="deckSelect"><b>Vocabulary Deck:</b></label>
  <select id="deckSelect">
    <option value="novice_1">TOCFL Novice 1 (160 entries)</option>
    <option value="novice_2">TOCFL Novice 2 (234 entries)</option>
    <option value="both">TOCFL Novice 1 & 2 (394 entries)</option>
  </select>
</div>

<div id="customContainer">
  <div id="currentListName"></div>
  <textarea id="wordList" placeholder="Enter words, one per line"></textarea><br>
  <button id="loadBtn">Load Custom List</button>
  <button id="saveListBtn" title="Save the words above as a named list, or update the currently selected saved list">Save List</button>
  <button id="newListBtn" title="Start a new empty saved list">New List</button>
  <button id="deleteListBtn" title="Delete the currently selected saved list">Delete List</button>
</div>

<div class="controls-group" style="font-size: 14px;">
  <label><input type="checkbox" id="hidePromptToggle"> Hide Character Prompt</label>
  &nbsp;&nbsp;
  <label><input type="checkbox" id="hideOutlineToggle"> Hide Outline / Shadow</label>
  &nbsp;&nbsp;
  <label><input type="checkbox" id="noHintToggle"> No-Hint Mode</label>
</div>

<div>
  <button id="prevBtn">Previous</button>
  <button id="nextBtn">Next</button>
  <button id="replayBtn">Stroke Replay</button>
</div>

<div id="progressIndicator" style="font-weight: bold; margin: 8px;"></div>
<div id="char"></div>
<div id="pinyin"></div>
<div id="vocabInfo"></div>
<div id="writer"></div>
<div id="stats"></div>
<div id="feedback" aria-live="polite" aria-label="Correct">✅</div>
<div id="completionMessage" role="status" aria-live="polite" hidden>🎉 Congratulations! You completed the deck/list!</div>

<div>
  <button id="exportBtn">Export</button>
  <button id="importBtn">Import</button>
  <button id="pdfBtn">Generate PDF Worksheet</button>
  <button id="gamesBtn">Games</button>
</div>
<p><em>Future games: Big2, Chinese Chess</em></p>

<script type="module" src="/src/main.js"></script>
</body>
</html>
