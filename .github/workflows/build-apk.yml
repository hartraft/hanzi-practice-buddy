name: Build Android APK & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install openpyxl pytest
      - name: Run tests
        run: |
          source venv/bin/activate
          pytest -o pythonpath=.

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set monotonic APK version code
        run: |
          echo "APK_VERSION_CODE=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Node dependencies
        run: npm install
      - name: Build web assets and sync
        run: npm run build
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-33 build-tools;33.0.0
      - name: Restore stable APK signing key
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Set the ANDROID_DEBUG_KEYSTORE_B64 repository secret to sign stable upgradeable APKs"
            exit 1
          fi
          echo "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > android/app/hanzi-debug.keystore
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
