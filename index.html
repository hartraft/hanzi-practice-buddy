<style>
body { font-family: Arial, sans-serif; padding: 10px; text-align: center; background:#fff; color:#000; }
body.dark { background:#000; color:#fff; }
textarea { width:100%; height:120px; margin-bottom:5px; }

#dictionaryPopup .dict-item:hover { background:#f5f5f5; }
body.dark #dictionaryPopup .dict-item:hover { background:#444; }
#dictionaryPopup .dict-char { font-size:20px; font-weight:bold; }
#dictionaryPopup .dict-pinyin { font-size:14px; color:#666; margin-left:8px; }
body.dark #dictionaryPopup .dict-pinyin { color:#aaa; }

function getJyut6ping(char) {
  return jyut6pingDict[char] || char;
}

function searchDictionary(query) {
  if (!query || query.length < 1) return [];
  const results = [];
  const queryLower = query.toLowerCase();
  for (const [char, pinyin] of Object.entries(jyut6pingDict)) {
    // Match if pinyin starts with query (e.g., "ngo" matches "ngo5")
    // or if character contains the query
    if (pinyin.startsWith(queryLower) || char.includes(query)) {
      results.push({ char, pinyin, matchType: pinyin.startsWith(queryLower) ? 'prefix' : 'contains' });
    }
  }
  // Sort: prefix matches first, then by contains
  results.sort((a, b) => {
    if (a.matchType !== b.matchType) return a.matchType === 'prefix' ? -1 : 1;
    return a.pinyin.localeCompare(b.pinyin);
  });
  return results.slice(0, 10);
}

let words = [];
let uniqueChars = [];
let charIndex = 0;
let writer = null;
let streak = 0;
let lastPracticeDate = null;
let todaySet = new Set();
let allCharsSet = new Set();

const els = {
  wordList: document.getElementById('wordList'),
  char: document.getElementById('char'),
  pinyin: document.getElementById('pinyin'),
  pinyinMandarin: document.getElementById('pinyin-mandarin'),
  pinyinCantonese: document.getElementById('pinyin-cantonese'),
  writer: document.getElementById('writer'),
  streak: document.getElementById('streak'),
  stats: document.getElementById('stats'),
  dictPopup: document.getElementById('dictionaryPopup'),
  langToggle: document.getElementById('langToggle')
};

function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(lastPracticeDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  streak = lastPracticeDate === yesterday ? streak + 1 : 1;
  lastPracticeDate = today;
  els.streak.textContent = `🔥 ${streak}`;
}

function saveProgress(){
  localStorage.setItem('hanziPracticeBuddy', JSON.stringify({
    words, uniqueChars, charIndex, streak, lastPracticeDate,
    today:[...todaySet], allChars:[...allCharsSet], langMode
  }));
}

function restoreProgress(){
  const raw = localStorage.getItem('hanziPracticeBuddy');
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    words = d.words || [];
    uniqueChars = d.uniqueChars || [];
    charIndex = d.charIndex || 0;
    streak = d.streak || 0;
    lastPracticeDate = d.lastPracticeDate || null;
    todaySet = new Set(d.today || []);
    allCharsSet = new Set(d.allChars || []);
    langMode = d.langMode || 'mandarin';
    els.wordList.value = words.join('\n');
    els.streak.textContent = `🔥 ${streak}`;
    updateLangButton();
    updateStatsText();
  }catch(e){}
}

function loadWords(){
  let input = els.wordList.value.split('\n').map(w=>w.trim()).filter(Boolean);
  input = [...new Set(input)];
  els.wordList.value = input.join('\n');
  if(!input.length){ alert('Enter at least one word'); return; }

  words = input.map(w => converter(w));

  const charSet = new Set();
  words.forEach(w => w.split('').forEach(c => {
    if (c.codePointAt(0) >= 0x4E00 && c.codePointAt(0) <= 0x9FFF) {
      charSet.add(c);
    }
  }));
  uniqueChars = Array.from(charSet);

  charIndex = 0;
  uniqueChars.forEach(c => allCharsSet.add(c));

  els.char.textContent = '';
  els.pinyinMandarin.textContent = '';
  els.pinyinCantonese.textContent = '';
  els.writer.innerHTML = '';

  showChar();
  updateURL();
  saveProgress();
}

function updateURL(){
  const encoded = encodeURIComponent(words.join(' '));
  history.replaceState(null,'',`?words=${encoded}`);
}

function loadFromURL(){
  const p = new URLSearchParams(location.search);
  if(!p.has('words')) return;
  const list = [...new Set(p.get('words').split(/[ ,\n]+/).filter(Boolean))];
  els.wordList.value = list.join('\n');
}

function getTone(pinyin, mode) {
  if (mode === 'cantonese') {
    const match = pinyin.match(/[1-6]/);
    return match ? parseInt(match[0]) : 5;
  }
  const match = pinyin.match(/[1-5]/);
  return match ? parseInt(match[0]) : 5;
}

function showChar(){
  if(!uniqueChars[charIndex]) return;
  const char = uniqueChars[charIndex];

  updateStreak(); todaySet.add(char); allCharsSet.add(char);
  els.char.textContent = char;
  
  try{
    // Get Mandarin pinyin
    const mandarinPy = pinyinPro.pinyin(char,{toneType:'num'});
    const mandarinTone = getTone(mandarinPy, 'mandarin');
    const mandarinPySymbol = pinyinPro.pinyin(char,{toneType:'symbol'});
    
    // Get Cantonese jyutping
    const cantonesePy = getJyut6ping(char);
    const cantoneseTone = getTone(cantonesePy, 'cantonese');
    
    // Color the character with the Mandarin pinyin tone color
    els.char.style.color = toneColors[mandarinTone] || toneColors[5];
    
    // Display both pronunciations side by side with tone colors
    // Mandarin: shown in blue-ish tones (Pleco style)
    const mandarinSpan = `<span id="pinyin-label">普:</span><span style="color:${toneColors[mandarinTone] || toneColors[5]}">${mandarinPySymbol}</span>`;
    const cantoneseSpan = `<span id="pinyin-label">粵:</span><span style="color:${toneColors[cantoneseTone] || toneColors[5]}">${cantonesePy}</span>`;
    els.pinyinMandarin.innerHTML = mandarinSpan;
    els.pinyinCantonese.innerHTML = cantoneseSpan;
  }catch(e){ 
    els.pinyinMandarin.textContent = '';
    els.pinyinCantonese.textContent = '';
  }

  els.writer.innerHTML='';
  writer = HanziWriter.create('writer', char, { width:300, height:300, showOutline:true, showCharacter:false });
  writer.quiz({ onComplete: nextChar });
  updateStatsText();
  saveProgress();
}

function nextChar(){
  if(charIndex >= uniqueChars.length - 1){ finishList(); return; }
  charIndex++;
  showChar();
}

function prevChar(){
  if(charIndex>0){ charIndex--; showChar(); }
}

function finishList(){
  const msg = document.createElement('div');
  msg.textContent = '🎉 Congratulations! You completed the word list!';
  msg.style.fontSize='24px'; msg.style.color='green';
  msg.style.position='fixed'; msg.style.top='40%'; msg.style.left='50%';
  msg.style.transform='translate(-50%, -50%)';
  msg.style.background='rgba(255,255,255,0.9)'; msg.style.padding='20px';
  msg.style.border='2px solid green'; msg.style.borderRadius='10px'; msg.style.zIndex='1000';
  document.body.appendChild(msg);
  setTimeout(()=>document.body.removeChild(msg),3000);
  els.char.textContent=''; els.pinyinMandarin.textContent=''; els.pinyinCantonese.textContent=''; els.writer.innerHTML='';
}

function updateStatsText(){
  els.stats.textContent = `Daily streak: ${streak}\nToday practiced: ${[...todaySet].join(', ')}\nTotal characters learned: ${allCharsSet.size}`;
}

// ===== IMPORT / EXPORT =====
function exportWords(){
  const blob = new Blob([JSON.stringify({ words })],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hanzi-practice-buddy-words.json'; a.click();
}

function importWords(){
  const input = document.createElement('input'); input.type='file'; input.accept='application/json';
  input.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        words = [...new Set(data.words || [])];
        els.wordList.value = words.join('\n');

        const charSet = new Set();
        words.forEach(w => w.split('').forEach(c => {
          if (c.codePointAt(0) >= 0x4E00 && c.codePointAt(0) <= 0x9FFF) {
            charSet.add(c);
          }
        }));
        uniqueChars = Array.from(charSet);

        charIndex = 0;
        uniqueChars.forEach(c => allCharsSet.add(c));

        showChar(); saveProgress();
      }catch(err){ alert('Invalid JSON file'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ===== PDF WORKSHEET =====
function generatePDF(){
  if(uniqueChars.length === 0){ alert('Load a word list first'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 10;
  const boxSize = 25;
  const gridPerChar = 4;
  let x=margin, y=margin;

  uniqueChars.forEach(char=>{
    for(let row=0; row<gridPerChar; row++){
      for(let col=0; col<gridPerChar; col++){
        doc.rect(x + col*boxSize, y + row*boxSize, boxSize, boxSize);
        doc.setFontSize(14);
        doc.text(char, x + col*boxSize + 6, y + row*boxSize + 18);
      }
    }
    const mandarinPy = pinyinPro.pinyin(char,{toneType:'symbol'});
    const cantonesePy = getJyut6ping(char);
    const py = `${mandarinPy} | ${cantonesePy}`;
    doc.setFontSize(10);
    doc.text(py, x + (gridPerChar*boxSize)/2, y + gridPerChar*boxSize + 5, {align:'center'});
    y += gridPerChar*boxSize + 15;
    if(y + gridPerChar*boxSize + 15 > pageHeight - margin){ doc.addPage(); y=margin; }
  });
  doc.save('hanzi-practice-buddy-worksheet.pdf');
}

// ===== LANGUAGE TOGGLE =====
function toggleLanguage() {
  langMode = langMode === 'mandarin' ? 'cantonese' : 'mandarin';
  updateLangButton();
  saveProgress();
  if (uniqueChars.length > 0) {
    showChar();
  }
}

function updateLangButton() {
  els.langToggle.textContent = langMode === 'mandarin' ? '普通话' : '粵語';
}

// ===== DICTIONARY POPUP =====
function showDictionaryPopup(query) {
  if (langMode !== 'cantonese' || !query) {
    els.dictPopup.style.display = 'none';
    return;
  }
  
  const results = searchDictionary(query);
  if (results.length === 0) {
    els.dictPopup.style.display = 'none';
    return;
  }
  
  els.dictPopup.innerHTML = results.map(r => 
    `<div class="dict-item" onclick="insertDictWord('${r.char}')">
      <span class="dict-char">${r.char}</span>
      <span class="dict-pinyin">${r.pinyin}</span>
    </div>`
  ).join('');
  els.dictPopup.style.display = 'block';
}

function insertDictWord(word) {
  const pos = els.wordList.selectionStart;
  const text = els.wordList.value;
  
  // Find the start of the current pinyin (look back from cursor for non-Chinese characters)
  let start = pos;
  while (start > 0) {
    const char = text[start - 1];
    // Stop if we hit a Chinese character or newline (start of a new word)
    if (/[\u4e00-\u9fff]/.test(char) || char === '\n') {
      break;
    }
    start--;
  }
  
  // Replace the pinyin with the selected character
  const newText = text.slice(0, start) + word + text.slice(pos);
  els.wordList.value = newText;
  
  // Position cursor after the inserted character
  const newPos = start + word.length;
  els.wordList.setSelectionRange(newPos, newPos);
  els.wordList.focus();
  
  // Trigger popup for next input after a brief delay
  setTimeout(() => {
    const currentText = els.wordList.value;
    const cursorPos = els.wordList.selectionStart;
    
    // Find the pinyin after the last newline or Chinese character
    let pinyinStart = cursorPos;
    while (pinyinStart < currentText.length) {
      const char = currentText[pinyinStart];
      if (/[\u4e00-\u9fff]/.test(char) || char === '\n') {
        break;
      }
      pinyinStart++;
    }
    
    const lastNewline = currentText.lastIndexOf('\n', cursorPos - 1);
    const lastWord = lastNewline >= 0 ? currentText.slice(lastNewline + 1, cursorPos) : currentText.slice(0, cursorPos);
    showDictionaryPopup(lastWord);
  }, 10);
}

// ===== EVENT LISTENERS =====
document.getElementById('loadBtn').onclick=loadWords;
document.getElementById('nextBtn').onclick=nextChar;
document.getElementById('prevBtn').onclick=prevChar;
document.getElementById('statsBtn').onclick=updateStatsText;
document.getElementById('darkToggle').onclick = ()=>document.body.classList.toggle('dark');
document.getElementById('exportBtn').onclick = exportWords;
document.getElementById('importBtn').onclick = importWords;
document.getElementById('pdfBtn').onclick = generatePDF;
document.getElementById('gamesBtn').onclick = ()=>alert('Games coming soon: Big2, Chinese Chess');
document.getElementById('langToggle').onclick = toggleLanguage;

els.wordList.addEventListener('input', (e) => {
  if (langMode === 'cantonese') {
    const text = e.target.value;
    // Get the last word/characters typed (up to 5 characters for pinyin matching)
    const lastSpaceIndex = text.lastIndexOf('\n');
    const lastWord = lastSpaceIndex >= 0 ? text.slice(lastSpaceIndex + 1) : text;
    showDictionaryPopup(lastWord);
  }
});

document.addEventListener('DOMContentLoaded',()=>{ loadFromURL(); restoreProgress(); });
</script>
