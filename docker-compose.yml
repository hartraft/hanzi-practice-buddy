version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hanzi
      POSTGRES_PASSWORD: hanzi
      POSTGRES_DB: hanzi_buddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanzi"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://hanzi:hanzi@postgres:5432/hanzi_buddy"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      DB_USER: "hanzi"
      DB_PASSWORD: "hanzi"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8555:80"
    volumes:
      - ./build/js/packages/hanzi-practice-buddy/webpack:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/http.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
