name: Shopping List Android

on:
  push:
    paths:
      - 'shopping-list/**'
      - '.github/workflows/shopping-list-android.yml'
  pull_request:
    paths:
      - 'shopping-list/**'
      - '.github/workflows/shopping-list-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopping-list
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.SHOPPING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SHOPPING_SUPABASE_PUBLISHABLE_KEY }}
          VITE_POWERSYNC_URL: ${{ secrets.SHOPPING_POWERSYNC_URL }}
        run: npm run build
      - name: Generate Android project
        run: |
          npx cap add android
          node scripts/patch-android-manifest.mjs
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: household-shopping-list-debug
          path: shopping-list/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
